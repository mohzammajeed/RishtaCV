<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RishtaCV Admin</title>
<style>body{font:15px system-ui,sans-serif;margin:0 auto;padding:16px;max-width:800px}.c{border:1px solid #ccc;border-radius:10px;padding:12px;margin:10px 0}img{max-width:100%;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#1f4d33;color:#fff;font-weight:600}</style></head><body>
<h2>RishtaCV Admin: failed payment reports</h2><button id="lg">Sign in with Google</button><div id="o"></div>
<script type="module">
const V='https://cdn.jsdelivr.net/npm/firebase@10.14.1/';
const[a,m]=await Promise.all([import(V+'app/+esm'),import(V+'auth/+esm')]);
const app=a.initializeApp({apiKey:'AIzaSyBL5gcxQVWeCUin7o9bjp7GG0Azd7kdRPU',authDomain:'rishta-cv.firebaseapp.com',projectId:'rishta-cv',storageBucket:'rishta-cv.firebasestorage.app',messagingSenderId:'321137751082',appId:'1:321137751082:web:5beb862a7e16364be73f53',measurementId:'G-K46VG87LZF'});
const au=m.getAuth(app),o=document.getElementById('o');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function call(n,b){const t=await au.currentUser.getIdToken(),r=await fetch('/api/'+n,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(b||{})}),j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function load(){try{const r=(await call('admin-list')).items;
o.innerHTML=r.length?r.map(x=>`<div class="c"><b>${esc(x.email)}</b><br>CV: ${esc(x.cvId)}<br>Reason: ${esc(x.reason)}<br>TID typed: ${esc(x.typedTid)||'-'}<br>${x.img?`<img src="data:image/jpeg;base64,${esc(x.img)}">`:''}<p><button data-a="${esc(x.id)}">Force Unlock Pro</button></p></div>`).join(''):'No failed reports.'}catch(e){o.textContent=e.message}}
o.onclick=async e=>{const id=e.target.dataset.a;if(!id||!confirm('Unlock this CV?'))return;try{await call('admin-unlock',{attemptId:id});load()}catch(x){alert(x.message)}};
document.getElementById('lg').onclick=()=>m.signInWithPopup(au,new m.GoogleAuthProvider());
m.onAuthStateChanged(au,u=>{if(u)load()});
</script></body></html>
