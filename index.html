<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RishtaCV – Professional Rishta Profile Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter:wght@400;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf8f3;--card:#fff;--tx:#1d2b22;--mu:#6b7a70;--g:#1f4d33;--gold:#c09a3e;--bd:#e5dfd0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--card:#1b2620;--tx:#eef2ec;--mu:#9bab9f;--bd:#2c3a31;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px Inter,system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd)}
.logo{font:600 24px 'Playfair Display',serif;color:var(--g)}.logo b{color:var(--gold)}
@media(prefers-color-scheme:dark){.logo{color:#7fd6a2}}
main{max-width:980px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h2{margin:0 0 12px;font-size:19px}.ur{font-family:'Noto Nastaliq Urdu',serif;direction:rtl;line-height:2}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs div{padding:8px 12px;border-radius:20px;border:1px solid var(--bd);white-space:nowrap;font-size:13px;color:var(--mu)}.tabs .on{background:var(--g);color:#fff;border-color:var(--g)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit;margin-bottom:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
button{cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font:600 14px Inter,sans-serif;background:var(--g);color:#fff}
button.alt{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.gold{background:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.pick{grid-template-columns:1fr}}
.opt{border:2px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer;text-align:center}.opt.on{border-color:var(--gold);background:rgba(192,154,62,.1)}
.opt .ur{font-size:18px}.opt small{color:var(--mu)}
.scroll{overflow-x:auto}
#card{width:560px;min-height:780px;position:relative;margin:0 auto;padding:0;color:#1d2b22;overflow:hidden;font-family:Inter,'Noto Nastaliq Urdu',sans-serif;background:#fff}
.ci{background:#fbf7ea;border:2px solid #c09a3e}
.ci .top{background:linear-gradient(160deg,#16422b,#1f5d3b);color:#e7c870;text-align:center;padding:26px 20px 78px;border-bottom:4px solid #c09a3e;border-radius:0 0 50% 50%/0 0 36px 36px}
.ci .bsm{font:34px 'Noto Nastaliq Urdu',serif;direction:rtl;line-height:1.9}
.ci .sub{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.85}
.ci .pic{margin-top:-62px;position:relative}
.pic img,.pic div{width:132px;height:132px;border-radius:50%;object-fit:cover;border:5px solid #c09a3e;background:#e9e2cc;display:block;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.hd{text-align:center;padding:14px 28px 4px}
.nm2{font:600 28px 'Playfair Display',serif;color:#1f4d33}
.pf2{display:inline-block;margin-top:6px;padding:4px 16px;border-radius:20px;background:#c09a3e;color:#fff;font-weight:600;font-size:13px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px 28px 14px}
.gr>div{background:#fff;border:1px solid #eadfb9;border-radius:10px;padding:9px 12px}
.gr small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:#9a8a55}
.gr b{font-size:14.5px;color:#1f4d33}
.ft{text-align:center;color:#9a8a55;font-size:11px;padding-bottom:18px}
.cp{display:flex;min-height:780px}
.cp .sd{width:190px;background:#1f4d33;color:#fff;text-align:center;padding:40px 16px}
.cp .sd .pic img,.cp .sd .pic div{border-color:#fff;width:128px;height:128px}
.cp .sd .nm2{color:#fff;font-size:21px;margin-top:16px}
.cp .sd .pf2{background:rgba(255,255,255,.18);margin-top:10px}
.cp .mn{flex:1;padding:36px 26px}
.cp .sec{margin-bottom:24px}
.cp h4{margin:0 0 8px;color:#1f4d33;font-size:12px;letter-spacing:2px;text-transform:uppercase;border-bottom:2px solid #c09a3e;padding-bottom:6px}
.cp .rw{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}
.cp .rw span{color:#7a7a7a}.cp .rw b{text-align:right}
.rtl .nm2,.rtl .pf2,.rtl .gr,.rtl .rw,.rtl h4,.rtl .sub{font-family:'Noto Nastaliq Urdu',serif;line-height:1.9}
.rtl small,.rtl h4,.rtl .sub{letter-spacing:0;text-transform:none}.rtl .rw b{text-align:left}
.isl{background:#fbf6e6;border:10px double #c09a3e;outline:6px solid #1f4d33;outline-offset:-22px}
.pro{background:#fff;border-top:10px solid #1f4d33;box-shadow:0 0 0 1px #ddd inset}
.bism{font:30px 'Noto Nastaliq Urdu',serif;color:#1f4d33;margin-bottom:8px;direction:rtl}
.ph{width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid #c09a3e;background:#eee;margin:8px auto;display:block}
.nm{font:600 28px 'Playfair Display',serif;color:#1f4d33;margin:6px 0 2px}.pf{color:#a07a1f;font-weight:600;margin-bottom:14px}
.tb{text-align:left;margin-top:16px;border-top:1px solid #d9cfae}.tb div{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #eee6cc;font-size:14px}.tb span{color:#7a7a6a}.tb b{text-align:right}
.pro .pf{background:#1f4d33;color:#fff;display:inline-block;padding:4px 14px;border-radius:20px}
.wm{position:absolute;inset:0;overflow:hidden;pointer-events:none}.wmi{position:absolute;left:-50%;top:-50%;width:200%;height:200%;display:flex;flex-wrap:wrap;align-content:space-around;justify-content:space-around;transform:rotate(-30deg)}.wmi span{font:700 20px Inter,sans-serif;color:rgba(50,50,50,.2);padding:12px 18px;white-space:nowrap}
.note{font-size:12.5px;color:var(--mu);margin-top:8px}
.rtl{direction:rtl}.rtl .nm,.rtl .pf,.rtl .tb div{font-family:'Noto Nastaliq Urdu',serif}.rtl .tb{text-align:right}.rtl .tb b{text-align:left}.rtl .nm{line-height:1.8}
</style></head><body>
<header><div class="logo">☾ Rishta<b>CV</b></div><div id="who"></div></header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const L={
prof:['Doctor','Engineer','Software Developer','Teacher','Businessman','Government Job','Private Job','Army / Forces','Student','Alim / Imam','Freelancer','Shopkeeper','Farmer','Abroad / Overseas Job','Housewife'],
gender:['Male','Female'],
height:["5'0\"","5'2\"","5'4\"","5'6\"","5'8\"","5'10\"","6'0\"","6'2\""],
city:['Mansehra','Abbottabad','Peshawar','Islamabad','Lahore','Karachi'],
marital:['Single','Divorced','Widowed','Second Marriage'],
income:['30k-50k','50k-80k','80k-150k','150k+','Not Disclosed'],
family:['Nuclear','Joint'],
caste:['Pakistani','Indian','Bangladeshi','Afghan','Kashmiri','Arab','Turkish','British','American','Canadian','UAE'],
maslak:['Sunni','Deobandi','Barelvi','Ahle Hadees','Shia']};
const UL={'Age':'عمر','Gender':'جنس','Height':'قد','City':'شہر','Marital Status':'ازدواجی حیثیت','Education':'تعلیم','Monthly Income':'ماہانہ آمدنی','Family Type':'خاندانی نظام','Caste / Nationality':'ذات / قومیت','Maslak':'مسلک'};
const UV={'Male':'مرد','Female':'خاتون','Mansehra':'مانسہرہ','Abbottabad':'ایبٹ آباد','Peshawar':'پشاور','Islamabad':'اسلام آباد','Lahore':'لاہور','Karachi':'کراچی','Single':'غیر شادی شدہ','Divorced':'طلاق یافتہ','Widowed':'بیوہ / رنڈوا','Second Marriage':'دوسری شادی','Not Disclosed':'ظاہر نہیں','Nuclear':'الگ گھر','Joint':'مشترکہ','Pakistani':'پاکستانی','Indian':'ہندوستانی','Bangladeshi':'بنگلہ دیشی','Afghan':'افغان','Kashmiri':'کشمیری','Arab':'عرب','Turkish':'ترک','British':'برطانوی','American':'امریکی','Canadian':'کینیڈین','UAE':'متحدہ عرب امارات','Sunni':'سنی','Deobandi':'دیوبندی','Barelvi':'بریلوی','Ahle Hadees':'اہلِ حدیث','Shia':'شیعہ','Doctor':'ڈاکٹر','Engineer':'انجینئر','Software Developer':'سافٹ ویئر ڈویلپر','Teacher':'استاد','Businessman':'کاروباری','Government Job':'سرکاری ملازم','Private Job':'پرائیویٹ ملازم','Army / Forces':'پاک فوج','Student':'طالب علم','Alim / Imam':'عالم / امام','Freelancer':'فری لانسر','Shopkeeper':'دکاندار','Farmer':'کسان','Abroad / Overseas Job':'بیرونِ ملک ملازم','Housewife':'گھریلو خاتون'};
const UI={'Welcome to RishtaCV':'RishtaCV میں خوش آمدید','Continue with Google':'Google کے ساتھ جاری رکھیں','or create account':'یا اکاؤنٹ بنائیں','Name':'نام','Email':'ای میل','Password':'پاس ورڈ','Create account':'اکاؤنٹ بنائیں','Sign in':'لاگ اِن','Logout':'لاگ آؤٹ','Demo sign-in only. Real Google login needs Firebase/NextAuth on your backend.':'یہ صرف ڈیمو لاگ اِن ہے۔','1. Style':'۱۔ انداز','2. Personal':'۲۔ ذاتی معلومات','3. Family':'۳۔ خاندان','4. Photo':'۴۔ تصویر','5. Preview':'۵۔ پیش نظارہ','Personal Info':'ذاتی معلومات','Income / Family Background':'آمدنی / خاندانی پس منظر','Photo':'تصویر','Full Name':'پورا نام','Age':'عمر','Education':'تعلیم','Profession / Job':'پیشہ / ملازمت','Gender':'جنس','Height':'قد','City':'شہر','Marital Status':'ازدواجی حیثیت','Monthly Income':'ماہانہ آمدنی','Family Type':'خاندانی نظام','Caste / Nationality':'ذات / قومیت','Maslak':'مسلک','Select…':'منتخب کریں…','Other':'دیگر','Next':'آگے','Back':'پیچھے','🪄 Remove Background (free)':'🪄 بیک گراؤنڈ ہٹائیں (مفت)','✨ Enhance Photo':'✨ تصویر بہتر کریں','Remove Background runs in your browser. Enhance Photo needs the Gemini backend (/api/enhance-photo); in this demo it applies a simple brightness/contrast boost.':'بیک گراؤنڈ ہٹانا آپ کے براؤزر میں ہوتا ہے۔ تصویر بہتر کرنے کے لیے Gemini بیک اینڈ درکار ہے؛ ڈیمو میں صرف روشنی اور کنٹراسٹ بڑھایا جاتا ہے۔','Switch template':'ٹیمپلیٹ بدلیں','اردو / English':'English','🔗 Private link':'🔗 نجی لنک','Pay Rs.150 via EasyPaisa':'EasyPaisa کے ذریعے Rs.150 ادا کریں','Mark Paid (test)':'ادائیگی مکمل (ٹیسٹ)','✅ PRO – HD, no watermark':'✅ پرو – HD، بغیر واٹر مارک','Upload a photo first.':'پہلے تصویر اپلوڈ کریں۔','Removing background… (first run downloads the model)':'بیک گراؤنڈ ہٹایا جا رہا ہے… (پہلی بار ماڈل ڈاؤن لوڈ ہوگا)','Background removal could not load here (model files are blocked in this hosted demo). It will work when deployed on your own site with @imgly/background-removal installed.':'یہاں بیک گراؤنڈ ہٹانا لوڈ نہیں ہو سکا۔ اپنی ویب سائٹ پر ڈیپلائے کرنے پر کام کرے گا۔','Ahmed Khan':'احمد خان','Write your own…':'اپنا لکھیں…'};
const T={prof:'Profession / Job',gender:'Gender',height:'Height',city:'City',marital:'Marital Status',income:'Monthly Income',family:'Family Type',caste:'Caste / Nationality',maslak:'Maslak'};
const SHARE=(location.pathname.match(/^\/p\/([\w-]+)/)||[])[1];let SH=null,UID=null,CVS=[],CUR=null,view='list',PAY=null,PT=null;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FR={expired:'Time is over. Please start again.',wrong_amount:'The amount must be exactly Rs.150.',wrong_receiver:'This receipt is not for the payment number shown.',old_receipt:'This receipt is older than your payment start.',tid_used:'This transaction ID is already used.',unreadable:'We could not read the screenshot.'};
Object.assign(UI,{'My CVs':'میرے CV','← My CVs':'← میرے CV','+ New CV':'+ نیا CV','Open':'کھولیں','Delete':'حذف کریں','✅ Paid':'✅ ادا شدہ','Unpaid':'غیر ادا شدہ','Untitled CV':'بغیر نام CV','Loading…':'لوڈ ہو رہا ہے…','Pay to unlock this CV · Rs.150':'اس CV کو ان لاک کرنے کے لیے Rs.150 ادا کریں','Pay to unlock this CV':'اس CV کو ان لاک کرنے کے لیے ادائیگی کریں','Amount':'رقم','Cancel':'منسوخ','Send exactly':'بالکل بھیجیں','to this number':'اس نمبر پر','Copy':'کاپی','Copied':'کاپی ہو گیا','Time left':'باقی وقت','Upload receipt screenshot':'رسید کا اسکرین شاٹ اپلوڈ کریں','Submit receipt':'رسید جمع کرائیں','Choose the receipt screenshot first.':'پہلے رسید کا اسکرین شاٹ منتخب کریں۔','Checking receipt…':'رسید چیک ہو رہی ہے…','Try again with a clear screenshot':'صاف اسکرین شاٹ کے ساتھ دوبارہ کوشش کریں','Report on WhatsApp':'WhatsApp پر رپورٹ کریں','Start again':'دوبارہ شروع کریں','Transaction ID (optional)':'ٹرانزیکشن آئی ڈی (اختیاری)','Back':'پیچھے','Receipt not accepted.':'رسید قبول نہیں ہوئی۔','Time is over. Please start again.':'وقت ختم ہو گیا۔ دوبارہ شروع کریں۔','The amount must be exactly Rs.150.':'رقم بالکل Rs.150 ہونی چاہیے۔','This receipt is not for the payment number shown.':'یہ رسید دکھائے گئے نمبر کی نہیں ہے۔','This receipt is older than your payment start.':'یہ رسید ادائیگی شروع کرنے سے پہلے کی ہے۔','This transaction ID is already used.':'یہ ٹرانزیکشن آئی ڈی پہلے استعمال ہو چکی ہے۔','We could not read the screenshot.':'ہم اسکرین شاٹ نہیں پڑھ سکے۔'});
const tx=s=>(S.lang=='ur'&&UI[s])||s;
const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let S=ld('rcv_draft')||{style:'islamic',name:'',age:'',edu:''},step=0,user=ld('rcv_user'),paid=false;
const val=k=>S[k]==='Other'?(S[k+'_o']||''):(S[k]||'');
const sel=k=>`<label>${T[k]}</label><select data-k="${k}"><option value="">Select…</option>${L[k].map(o=>`<option value="${o}">${o}</option>`).join('')}<option value="Other">Other</option></select><input data-k="${k}_o" placeholder="Write your own…" style="display:none">`;
const steps=[
()=>`<h2 class="ur">آپ کس قسم کا رشتہ پروفائل بنانا چاہتے ہیں؟</h2><div class="pick">
<div class="opt ${S.style=='islamic'?'on':''}" onclick="S.style='islamic';draw()"><div class="ur">اسلامی رشتہ پروفائل</div><b>Islamic Rishta Profile</b><br><small>Green + Gold, Bismillah</small></div>
<div class="opt ${S.style=='pro'?'on':''}" onclick="S.style='pro';draw()"><div class="ur">نارمل پروفیشنل رشتہ پروفائل</div><b>Normal Professional Profile</b><br><small>Modern, clean design</small></div></div><h2 class="ur" style="margin-top:18px">CV کی زبان</h2><div class="pick"><div class="opt ${S.lang!='ur'?'on':''}" onclick="S.lang='en';draw()"><b>English CV</b></div><div class="opt ${S.lang=='ur'?'on':''}" onclick="S.lang='ur';draw()"><div class="ur">اردو CV</div></div></div>`,
()=>`<h2>Personal Info</h2><div class="grid"><div><label>Full Name</label><input data-k="name" placeholder="Ahmed Khan"></div>${['prof'].map(sel)}
<div><label>Age</label><input data-k="age" type="number" min="18" max="70"></div><div><label>Education</label><input data-k="edu" placeholder="MBBS / BS CS / MSc…"></div>
<div>${sel('gender')}</div><div>${sel('height')}</div><div>${sel('city')}</div><div>${sel('marital')}</div></div>`,
()=>`<h2>Income / Family Background</h2><div class="grid"><div>${sel('income')}</div><div>${sel('family')}</div><div>${sel('caste')}</div><div>${sel('maslak')}</div></div>`,
()=>`<h2>Photo</h2><input type="file" id="f" accept="image/*"><div class="row"><button class="alt" onclick="rmbg()">🪄 Remove Background (free)</button><button class="alt" onclick="enh()">✨ Enhance Photo</button></div><p class="note" id="pm">Remove Background runs in your browser. Enhance Photo needs the Gemini backend (/api/enhance-photo); in this demo it applies a simple brightness/contrast boost.</p>${S.photo?`<img class="ph" src="${S.photo}">`:''}`,
()=>`<div class="row" style="margin:0 0 12px"><button class="alt" onclick="S.style=S.style=='pro'?'islamic':'pro';draw()">Switch template</button><button class="alt" onclick="S.lang=S.lang=='ur'?'en':'ur';draw()">اردو / English</button><button onclick="exp('pdf')">⬇ PDF</button><button onclick="exp('jpg')">⬇ JPG</button><button onclick="exp('png')">⬇ PNG</button><button class="alt" onclick="link()">🔗 Private link</button></div>
<div class="row" style="margin:0 0 12px">${paid?'<b>✅ PRO – HD, no watermark</b>':'<button class="gold" onclick="pay()">Pay to unlock this CV · Rs.'+CFG.price+'</button>'}</div><div id="lk" class="note"></div><p class="note" style="margin:0 0 10px">${S.lang=='ur'?(paid?'HD میموری کوالٹی (پرنٹ کے لیے، تقریباً 300 DPI)':'اسٹینڈرڈ کوالٹی واٹر مارک کے ساتھ۔ HD کے لیے Rs.150 ادا کریں'):(paid?'HD quality, print-ready (about 300 DPI), no watermark':'Standard quality with watermark. Pay Rs.150 for HD.')}</p><div class="scroll">${cardHTML()}</div>`];
const tn=['Style','Personal','Family','Photo','Preview'];
function title(){const n=S.name||'Your Name',p=val('prof');const u=S.lang=='ur';if(p=='Doctor')return[(u?'ڈاکٹر ':'Dr. ')+n,S.edu||(u?'ڈاکٹر':'Doctor')];if(p=='Engineer')return[(u?'انجینئر ':'Engineer ')+n,S.edu||(u?'انجینئر':'Engineer')];return[n,(u&&UV[p])||p||S.edu||''];}
function cardHTML(){const[a,b]=title(),u=S.lang=='ur',isl=S.style=='islamic',L2=k=>u?(UL[k]||k):k,V=v=>u?(UV[v]||v):v,
r=(k,v)=>v?(isl?`<div><small>${L2(k)}</small><b>${V(v)}</b></div>`:`<div class="rw"><span>${L2(k)}</span><b>${V(v)}</b></div>`):'',
pic=`<div class="pic">${S.photo?`<img src="${S.photo}">`:'<div></div>'}</div>`,
P=r('Age',S.age)+r('Gender',val('gender'))+r('Height',val('height'))+r('City',val('city'))+r('Marital Status',val('marital'))+r('Education',S.edu),
F=r('Monthly Income',val('income'))+r('Family Type',val('family'))+r('Caste / Nationality',val('caste'))+r('Maslak',val('maslak')),
